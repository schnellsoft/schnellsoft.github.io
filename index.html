    <style>
      :root {
        --snd-header-bkr-clr: #101017;
        --snd-header-clr: #decf8c;
        --snd-header-fsz: 1.4rem;
        --snd-mob-header-fsz: 1.1rem;
        --snd-mob-header-submenu-fsz: 0.7rem;
        --snd-resct-bkr-clr: #372121;

      main {
        width: 100%;

      .ct-above-all {
        width: 200px;
        height: 100px;
        position: fixed;

      }
      :root * {
        margin: 0;

    <script type="module" crossorigin src="/assets/index-CKAh_UxS.js"></script>

  <body>
    <snd-header-aa style="z-index: 100000"></snd-header-aa>
    <snd-header-mob-aa
      class="snd-mob-header-hidden"
      style="z-index: 100000"
    ></snd-header-mob-aa>
    <main>
      <div
        class="snd-slide uk-position-relative uk-visible-toggle uk-light"
        tabindex="-1"
        uk-slideshow="animation: push"
      >
        <div class="uk-slideshow-items">
          <div>
            <img src="/assets/d1-NU1OSsxx.jpg" alt="" uk-cover />
            <div class="uk-position-center uk-position-small uk-text-center">
              <h2 uk-slideshow-parallax="x: 100,-100">Heading</h2>
              <p uk-slideshow-parallax="x: 200,-200">
                Lorem ipsum dolor sit amet.
              </p>
            </div>
          </div>
          <div>
            <img src="/assets/d2-BUfqGbCg.jpg" alt="" uk-cover />
            <div class="uk-position-center uk-position-small uk-text-center">
              <h2 uk-slideshow-parallax="x: 100,-100">Heading</h2>
              <p uk-slideshow-parallax="x: 200,-200">
                Lorem ipsum dolor sit amet.
              </p>
            </div>
          </div>
          <div>
            <img src="/assets/d3-FeaE4Kt6.jpg" alt="" uk-cover />
            <div class="uk-position-center uk-position-small uk-text-center">
              <h2 uk-slideshow-parallax="y: -50,0,0; opacity: 1,1,0">
                Heading
              </h2>
              <p uk-slideshow-parallax="y: 50,0,0; opacity: 1,1,0">
                Lorem ipsum dolor sit amet.
              </p>
            </div>
          </div>
        </div>

        <a
          class="uk-position-center-left uk-position-small uk-hidden-hover"
          href
          uk-slidenav-previous
          uk-slideshow-item="previous"
        ></a>
        <a
          class="uk-position-center-right uk-position-small uk-hidden-hover"
          href
          uk-slidenav-next
          uk-slideshow-item="next"
        ></a>
      </div>
      <!--
    <div class="ct-above-all">
      <button id="btn01">Click 01</button>
    </div>
    -->
      <script>
        let el = document.querySelector(".snd-slide");
        let w = window.innerWidth;
        let h = window.innerHeight;
        el.setAttribute("ratio", "" + w + ":" + h);
        window.addEventListener("resize", () => {
          let w = window.innerWidth;
          let h = window.innerHeight;
          el.setAttribute("ratio", "" + w + ":" + h);
        });
      </script>
    </main>
    <footer></footer>
